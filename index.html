<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards & Revision - ToolBundle</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0b0d13;
      --surface: #141721;
      --card-bg: #1c202e;
      --border: #2a3144;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 1.5rem; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 720px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .title-group { display: flex; align-items: center; gap: 0.75rem; }
    .badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 9999px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
    .badge.online { border-color: var(--success); color: var(--success); }

    .btn { background: var(--accent); color: white; border: none; padding: 0.6rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.15s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--card-bg); border-color: #3b4257; }

    /* Top Controls */
    .deck-bar { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    select { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.6rem; border-radius: 8px; outline: none; }
    
    /* Stats Header */
    .deck-stats { display: flex; gap: 1rem; margin-bottom: 1rem; font-size: 0.85rem; color: var(--text-muted); }
    .stat-pill { background: var(--surface); padding: 0.3rem 0.8rem; border-radius: 6px; border: 1px solid var(--border); }
    .stat-pill b { color: var(--text); }

    /* Flashcard Flip Stage */
    .stage { perspective: 1000px; margin-bottom: 1.25rem; }
    .flashcard {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
      min-height: 280px; display: flex; flex-direction: column; justify-content: center;
      align-items: center; text-align: center; padding: 2rem; cursor: pointer;
      position: relative; transition: border-color 0.2s; user-select: none;
    }
    .flashcard:hover { border-color: #3b4257; }
    .card-meta { position: absolute; top: 1rem; left: 1.25rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .card-shortcut-hint { position: absolute; bottom: 1rem; font-size: 0.75rem; color: #6b7280; }
    .card-text { font-size: 1.35rem; line-height: 1.6; font-weight: 500; }

    /* SRS Buttons */
    .rating-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 1.5rem; }
    .rate-btn { padding: 0.8rem 0.5rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; color: white; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; font-size: 0.85rem; }
    .rate-sub { font-size: 0.7rem; opacity: 0.8; font-weight: 400; }
    .btn-again { background: #dc2626; }
    .btn-hard { background: #d97706; }
    .btn-good { background: #2563eb; }
    .btn-easy { background: #059669; }

    /* Accordion Panels */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .panel-title { font-size: 0.95rem; font-weight: 600; }
    .panel-content { display: none; margin-top: 1rem; }
    .panel-content.open { display: block; }

    input, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.75rem; border-radius: 6px; margin-bottom: 0.75rem; font-size: 0.9rem; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .button-group { display: flex; gap: 0.5rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-group">
      <h2>⚡ ToolBundle Flashcards</h2>
      <span class="badge" id="cloudBadge">● Local Only</span>
    </div>
    <button class="btn btn-secondary" id="authBtn">Connect Drive</button>
  </header>

  <!-- Deck Switcher & Creation -->
  <div class="deck-bar">
    <select id="deckSelector" onchange="switchDeck()"></select>
    <button class="btn btn-secondary" onclick="promptNewDeck()">+ Deck</button>
    <button class="btn btn-secondary" onclick="deleteCurrentDeck()">🗑️</button>
  </div>

  <div class="deck-stats">
    <div class="stat-pill">Due Today: <b id="dueCount">0</b></div>
    <div class="stat-pill">Total Cards: <b id="totalCount">0</b></div>
  </div>

  <!-- Study Stage -->
  <div class="stage">
    <div class="flashcard" id="cardBox" onclick="flipCard()">
      <span class="card-meta" id="cardMeta">Question</span>
      <div class="card-text" id="cardText">All caught up for today! 🎉</div>
      <div class="card-shortcut-hint" id="cardHint">[Click or Space to Flip]</div>
    </div>
  </div>

  <!-- 4-Button SM-2 Controls -->
  <div class="rating-row" id="srsControls" style="display: none;">
    <button class="rate-btn btn-again" onclick="answerCard(1)">
      Again <span class="rate-sub">&lt; 10m (1)</span>
    </button>
    <button class="rate-btn btn-hard" onclick="answerCard(2)">
      Hard <span class="rate-sub">1d (2)</span>
    </button>
    <button class="rate-btn btn-good" onclick="answerCard(3)">
      Good <span class="rate-sub" id="goodInt">-- (3)</span>
    </button>
    <button class="rate-btn btn-easy" onclick="answerCard(4)">
      Easy <span class="rate-sub" id="easyInt">-- (4)</span>
    </button>
  </div>

  <!-- Add Card Panel -->
  <div class="panel">
    <div class="panel-header" onclick="togglePanel('addPanel')">
      <span class="panel-title">+ Add Flashcard</span>
      <span id="addPanelArrow">▼</span>
    </div>
    <div class="panel-content" id="addPanel">
      <input type="text" id="frontIn" placeholder="Front (Term or Question)" />
      <textarea id="backIn" rows="2" placeholder="Back (Definition or Formula)"></textarea>
      <button class="btn" style="width: 100%;" onclick="addSingleCard()">Add to Deck</button>
    </div>
  </div>

  <!-- Bulk Import / Export Panel -->
  <div class="panel">
    <div class="panel-header" onclick="togglePanel('bulkPanel')">
      <span class="panel-title">⚡ Bulk Import / Export (Quizlet Style)</span>
      <span id="bulkPanelArrow">▼</span>
    </div>
    <div class="panel-content" id="bulkPanel">
      <textarea id="bulkData" rows="4" placeholder="Term 1 [TAB] Definition 1&#10;Term 2 [TAB] Definition 2"></textarea>
      <div class="button-group">
        <button class="btn btn-secondary" style="flex: 1;" onclick="importBulk()">Import Lines</button>
        <button class="btn btn-secondary" style="flex: 1;" onclick="exportBulk()">Copy Deck as TSV</button>
      </div>
    </div>
  </div>
</div>

<script>
  const CLIENT_ID = '286157587092-qa3c8ma7uo2drjf1tjonnc55cb45v22m.apps.googleusercontent.com';
  const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';

  let accessToken = null;
  let tokenClient = null;
  let currentDeck = 'Default Deck';
  let isFlipped = false;
  let queue = [];
  let activeCard = null;

  // Initial State Store
  let db = JSON.parse(localStorage.getItem('tb_srs_data')) || {
    "Default Deck": [
      { id: 1, front: "What does the SM-2 algorithm calculate?", back: "The exact interval to review a card before forgetting it.", reps: 0, ef: 2.5, interval: 0, due: Date.now() },
      { id: 2, front: "Boyle's Law Formula", back: "P1 * V1 = P2 * V2 (Temperature is constant)", reps: 0, ef: 2.5, interval: 0, due: Date.now() }
    ]
  };

  window.onload = () => {
    initAuth();
    populateDecks();
    loadQueue();
    setupKeyboard();
  };

  function initAuth() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: (res) => {
        if (res?.access_token) {
          accessToken = res.access_token;
          const badge = document.getElementById('cloudBadge');
          badge.innerText = '● Drive Synced';
          badge.classList.add('online');
          document.getElementById('authBtn').style.display = 'none';
          pullFromDrive();
        }
      }
    });
    document.getElementById('authBtn').onclick = () => tokenClient.requestAccessToken();
  }

  /* --- SM-2 Algorithm Implementation --- */
  function calculateSM2(card, rating) {
    let { reps, ef, interval } = card;

    // Rating: 1 = Again, 2 = Hard, 3 = Good, 4 = Easy
    if (rating === 1) {
      reps = 0;
      interval = 1; // 1 day
    } else {
      if (reps === 0) interval = 1;
      else if (reps === 1) interval = (rating === 2) ? 3 : 6;
      else interval = Math.round(interval * ef);

      if (rating === 2) interval = Math.max(1, Math.round(interval * 0.8));
      if (rating === 4) interval = Math.round(interval * 1.3);
      reps++;
    }

    // Adjust ease factor (minimum 1.3)
    ef = ef + (0.1 - (4 - rating) * (0.08 + (4 - rating) * 0.02));
    if (ef < 1.3) ef = 1.3;

    const nextDue = Date.now() + (interval * 24 * 60 * 60 * 1000);
    return { ...card, reps, ef, interval, due: nextDue };
  }

  /* --- Study Queue Engine --- */
  function loadQueue() {
    const cards = db[currentDeck] || [];
    const now = Date.now();
    queue = cards.filter(c => c.due <= now);

    document.getElementById('totalCount').innerText = cards.length;
    document.getElementById('dueCount').innerText = queue.length;

    isFlipped = false;
    document.getElementById('srsControls').style.display = 'none';

    if (queue.length > 0) {
      activeCard = queue[0];
      document.getElementById('cardMeta').innerText = `Card 1 of ${queue.length}`;
      document.getElementById('cardText').innerText = activeCard.front;
      document.getElementById('cardHint').innerText = '[Click or Space to Flip]';
    } else {
      activeCard = null;
      document.getElementById('cardMeta').innerText = 'Finished';
      document.getElementById('cardText').innerText = 'All caught up for today! 🎉';
      document.getElementById('cardHint').innerText = '';
    }
  }

  function flipCard() {
    if (!activeCard) return;
    isFlipped = !isFlipped;
    document.getElementById('cardMeta').innerText = isFlipped ? 'Answer' : 'Question';
    document.getElementById('cardText').innerText = isFlipped ? activeCard.back : activeCard.front;
    document.getElementById('srsControls').style.display = isFlipped ? 'grid' : 'none';
    document.getElementById('cardHint').innerText = isFlipped ? '[Press 1, 2, 3, or 4]' : '[Click or Space to Flip]';

    if (isFlipped) {
      // Calculate preview days on buttons
      const goodInt = activeCard.reps === 0 ? 1 : Math.round((activeCard.interval || 1) * activeCard.ef);
      const easyInt = Math.round(goodInt * 1.3);
      document.getElementById('goodInt').innerText = `${goodInt}d (3)`;
      document.getElementById('easyInt').innerText = `${easyInt}d (4)`;
    }
  }

  function answerCard(rating) {
    if (!activeCard) return;
    const updated = calculateSM2(activeCard, rating);

    // Save update to deck
    const deckCards = db[currentDeck];
    const idx = deckCards.findIndex(c => c.id === activeCard.id);
    deckCards[idx] = updated;

    saveData();
    loadQueue();
  }

  /* --- Decks & Card Creation --- */
  function populateDecks() {
    const selector = document.getElementById('deckSelector');
    selector.innerHTML = '';
    Object.keys(db).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.innerText = name;
      if (name === currentDeck) opt.selected = true;
      selector.appendChild(opt);
    });
  }

  function switchDeck() {
    currentDeck = document.getElementById('deckSelector').value;
    loadQueue();
  }

  function promptNewDeck() {
    const name = prompt('Deck Name:');
    if (name && !db[name]) {
      db[name] = [];
      currentDeck = name;
      populateDecks();
      saveData();
      loadQueue();
    }
  }

  function deleteCurrentDeck() {
    if (Object.keys(db).length <= 1) return alert('Cannot delete your only deck.');
    if (confirm(`Delete deck "${currentDeck}"?`)) {
      delete db[currentDeck];
      currentDeck = Object.keys(db)[0];
      populateDecks();
      saveData();
      loadQueue();
    }
  }

  function addSingleCard() {
    const front = document.getElementById('frontIn').value.trim();
    const back = document.getElementById('backIn').value.trim();
    if (!front || !back) return;

    db[currentDeck].push({
      id: Date.now(),
      front, back, reps: 0, ef: 2.5, interval: 0, due: Date.now()
    });

    document.getElementById('frontIn').value = '';
    document.getElementById('backIn').value = '';
    saveData();
    loadQueue();
  }

  function importBulk() {
    const raw = document.getElementById('bulkData').value.trim();
    if (!raw) return;

    const lines = raw.split('\n');
    let added = 0;
    lines.forEach(line => {
      const parts = line.includes('\t') ? line.split('\t') : line.split('-');
      if (parts.length >= 2) {
        db[currentDeck].push({
          id: Date.now() + Math.random(),
          front: parts[0].trim(),
          back: parts.slice(1).join('-').trim(),
          reps: 0, ef: 2.5, interval: 0, due: Date.now()
        });
        added++;
      }
    });

    document.getElementById('bulkData').value = '';
    saveData();
    loadQueue();
    alert(`Imported ${added} cards!`);
  }

  function exportBulk() {
    const tsv = db[currentDeck].map(c => `${c.front}\t${c.back}`).join('\n');
    navigator.clipboard.writeText(tsv);
    alert('Deck copied to clipboard in TSV format!');
  }

  function togglePanel(id) {
    const el = document.getElementById(id);
    el.classList.toggle('open');
  }

  function setupKeyboard() {
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); flipCard(); }
      if (isFlipped) {
        if (e.key === '1') answerCard(1);
        if (e.key === '2') answerCard(2);
        if (e.key === '3') answerCard(3);
        if (e.key === '4') answerCard(4);
      }
    });
  }

  /* --- Persistence: LocalStorage + Drive AppData --- */
  function saveData() {
    localStorage.setItem('tb_srs_data', JSON.stringify(db));
    if (accessToken) pushToDrive();
  }

  async function pushToDrive() {
    const searchRes = await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='toolbundle_decks.json'", {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const searchData = await searchRes.json();
    const fileId = searchData.files?.[0]?.id;
    const fileContent = new Blob([JSON.stringify(db)], { type: 'application/json' });

    if (fileId) {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { Authorization: `Bearer ${accessToken}` },
        body: fileContent
      });
    } else {
      const metadata = { name: 'toolbundle_decks.json', parents: ['appDataFolder'] };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', fileContent);
      await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { Authorization: `Bearer ${accessToken}` },
        body: form
      });
    }
  }

  async function pullFromDrive() {
    const searchRes = await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='toolbundle_decks.json'", {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const searchData = await searchRes.json();
    if (searchData.files?.length > 0) {
      const res = await fetch(`https://www.googleapis.com/drive/v3/files/${searchData.files[0].id}?alt=media`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      db = await res.json();
      localStorage.setItem('tb_srs_data', JSON.stringify(db));
      populateDecks();
      loadQueue();
    }
  }
</script>

</body>
</html>
