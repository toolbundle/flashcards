<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToolBundle Study Suite</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #141722;
      --card: #1d2232;
      --border: #2d354a;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 1.5rem 1rem; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 760px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .badge { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 9999px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
    .badge.online { border-color: var(--success); color: var(--success); }

    /* Nav Tabs */
    .mode-tabs { display: flex; gap: 0.5rem; background: var(--surface); padding: 0.35rem; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 1.5rem; }
    .tab-btn { flex: 1; padding: 0.6rem; border: none; background: transparent; color: var(--muted); font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.15s; font-size: 0.85rem; }
    .tab-btn.active { background: var(--card); color: var(--text); }

    .btn { background: var(--accent); color: white; border: none; padding: 0.6rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.15s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--card); }

    .deck-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    select { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.6rem; border-radius: 8px; outline: none; }

    /* Flashcard Stage */
    .flashcard { background: var(--card); border: 1px solid var(--border); border-radius: 14px; min-height: 260px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem; cursor: pointer; position: relative; user-select: none; }
    .card-meta { position: absolute; top: 1rem; left: 1.25rem; font-size: 0.75rem; text-transform: uppercase; color: var(--muted); }
    .card-text { font-size: 1.35rem; font-weight: 500; line-height: 1.5; }
    .card-hint { position: absolute; bottom: 1rem; font-size: 0.75rem; color: #6b7280; }

    .rating-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-top: 1rem; margin-bottom: 1.5rem; }
    .rate-btn { padding: 0.75rem 0.5rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; color: white; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; font-size: 0.8rem; }
    .rate-sub { font-size: 0.65rem; opacity: 0.8; font-weight: 400; }
    .btn-again { background: #dc2626; }
    .btn-hard { background: #d97706; }
    .btn-good { background: #2563eb; }
    .btn-easy { background: #059669; }

    /* Learn Mode */
    .learn-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; }
    .learn-prompt { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem; }
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
    .option-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 1rem; border-radius: 8px; text-align: left; cursor: pointer; font-size: 0.95rem; transition: 0.15s; }
    .option-btn:hover { border-color: var(--accent); }
    .option-btn.correct { background: #065f46; border-color: var(--success); }
    .option-btn.wrong { background: #7f1d1d; border-color: var(--danger); }

    /* Match Mode */
    .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .match-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    .tile { background: var(--card); border: 2px solid var(--border); padding: 1.25rem 0.75rem; border-radius: 10px; min-height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: 0.2s; user-select: none; }
    .tile:hover { border-color: #4b5563; }
    .tile.selected { border-color: var(--accent); background: #1e293b; }
    .tile.matched { opacity: 0; pointer-events: none; transform: scale(0.9); }
    .tile.error { border-color: var(--danger); background: #450a0a; }

    /* Panels */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-top: 1.5rem; }
    textarea, input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.75rem; border-radius: 6px; margin-bottom: 0.75rem; font-size: 0.85rem; }
    textarea:focus, input:focus { outline: none; border-color: var(--accent); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h2>⚡ ToolBundle Revision</h2>
      <span class="badge" id="cloudBadge">● Local Only</span>
    </div>
    <button class="btn btn-secondary" id="authBtn">Connect Drive</button>
  </header>

  <!-- Navigation Tabs -->
  <div class="mode-tabs">
    <button class="tab-btn active" onclick="switchMode('cards')">🃏 Flashcards (SM-2)</button>
    <button class="tab-btn" onclick="switchMode('learn')">🧠 Learn</button>
    <button class="tab-btn" onclick="switchMode('match')">🧩 Match</button>
  </div>

  <div class="deck-bar">
    <select id="deckSelector" onchange="switchDeck()"></select>
    <button class="btn btn-secondary" onclick="promptNewDeck()">+ Deck</button>
  </div>

  <!-- MODE 1: Flashcards -->
  <div id="modeCards">
    <div class="flashcard" id="cardBox" onclick="flipCard()">
      <span class="card-meta" id="cardMeta">Question</span>
      <div class="card-text" id="cardText">Loading deck...</div>
      <div class="card-hint" id="cardHint">[Space or Click to Flip]</div>
    </div>
    <div class="rating-row" id="srsControls" style="display: none;">
      <button class="rate-btn btn-again" onclick="answerCard(1)">Again <span class="rate-sub">&lt;10m (1)</span></button>
      <button class="rate-btn btn-hard" onclick="answerCard(2)">Hard <span class="rate-sub">1d (2)</span></button>
      <button class="rate-btn btn-good" onclick="answerCard(3)">Good <span class="rate-sub" id="goodInt">-- (3)</span></button>
      <button class="rate-btn btn-easy" onclick="answerCard(4)">Easy <span class="rate-sub" id="easyInt">-- (4)</span></button>
    </div>
  </div>

  <!-- MODE 2: Learn -->
  <div id="modeLearn" style="display: none;">
    <div class="learn-box">
      <div class="learn-prompt" id="learnPrompt">What is...</div>
      <div class="options-grid" id="learnOptions"></div>
    </div>
  </div>

  <!-- MODE 3: Match Game -->
  <div id="modeMatch" style="display: none;">
    <div class="match-header">
      <span>Time: <b id="matchTimer">0.0s</b></span>
      <button class="btn btn-secondary" onclick="startMatchGame()">Restart</button>
    </div>
    <div class="match-grid" id="matchGrid"></div>
  </div>

  <!-- Import Panel -->
  <div class="panel">
    <h4 style="margin-bottom: 0.75rem;">⚡ Bulk Import (Tab / Dash Separated)</h4>
    <textarea id="bulkData" rows="3" placeholder="Term [TAB] Definition&#10;Primary research - Direct collection of original data"></textarea>
    <button class="btn" style="width: 100%;" onclick="importBulk()">Import Into Current Deck</button>
  </div>
</div>

<script>
  const CLIENT_ID = '286157587092-qa3c8ma7uo2drjf1tjonnc55cb45v22m.apps.googleusercontent.com';
  const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';

  let accessToken = null;
  let tokenClient = null;
  let currentDeck = 'Marketing IGCSE';
  let isFlipped = false;
  let queue = [];
  let activeCard = null;

  let db = JSON.parse(localStorage.getItem('tb_study_suite')) || {
    "Marketing IGCSE": [
      { id: 1, front: "A customer", back: "A person or organisation which buys goods or services from a business.", reps: 0, ef: 2.5, interval: 0, due: Date.now() },
      { id: 2, front: "Market Share", back: "The percentage of total market sales held by one brand or business.", reps: 0, ef: 2.5, interval: 0, due: Date.now() },
      { id: 3, front: "Price Skimming", back: "Setting a high price for a new unique product entering the market.", reps: 0, ef: 2.5, interval: 0, due: Date.now() },
      { id: 4, front: "Penetration Pricing", back: "Pricing lower than competitors to gain rapid entry into a market.", reps: 0, ef: 2.5, interval: 0, due: Date.now() },
      { id: 5, front: "USP", back: "The special feature differentiating a product from its competitors.", reps: 0, ef: 2.5, interval: 0, due: Date.now() },
      { id: 6, front: "Brand Loyalty", back: "When consumers continually choose the same brand over competitors.", reps: 0, ef: 2.5, interval: 0, due: Date.now() }
    ]
  };

  window.onload = () => {
    initAuth();
    populateDecks();
    loadQueue();
    setupKeys();
  };

  function initAuth() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: (res) => {
        if (res?.access_token) {
          accessToken = res.access_token;
          const badge = document.getElementById('cloudBadge');
          badge.innerText = '● Drive Synced';
          badge.classList.add('online');
          document.getElementById('authBtn').style.display = 'none';
          pullFromDrive();
        }
      }
    });
    document.getElementById('authBtn').onclick = () => tokenClient.requestAccessToken();
  }

  function switchMode(mode) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', ['cards', 'learn', 'match'][i] === mode);
    });
    document.getElementById('modeCards').style.display = mode === 'cards' ? 'block' : 'none';
    document.getElementById('modeLearn').style.display = mode === 'learn' ? 'block' : 'none';
    document.getElementById('modeMatch').style.display = mode === 'match' ? 'block' : 'none';

    if (mode === 'learn') startLearnCard();
    if (mode === 'match') startMatchGame();
  }

  /* --- FLASHCARDS & SM-2 --- */
  function calculateSM2(card, rating) {
    let { reps, ef, interval } = card;
    if (rating === 1) {
      reps = 0;
      interval = 1;
    } else {
      if (reps === 0) interval = 1;
      else if (reps === 1) interval = (rating === 2) ? 3 : 6;
      else interval = Math.round(interval * ef);

      if (rating === 2) interval = Math.max(1, Math.round(interval * 0.8));
      if (rating === 4) interval = Math.round(interval * 1.3);
      reps++;
    }
    ef = Math.max(1.3, ef + (0.1 - (4 - rating) * (0.08 + (4 - rating) * 0.02)));
    return { ...card, reps, ef, interval, due: Date.now() + (interval * 86400000) };
  }

  function loadQueue() {
    const cards = db[currentDeck] || [];
    const now = Date.now();
    queue = cards.filter(c => c.due <= now);
    isFlipped = false;
    document.getElementById('srsControls').style.display = 'none';

    if (queue.length > 0) {
      activeCard = queue[0];
      document.getElementById('cardMeta').innerText = `Card 1 of ${queue.length}`;
      document.getElementById('cardText').innerText = activeCard.front;
      document.getElementById('cardHint').innerText = '[Space or Click to Flip]';
    } else {
      activeCard = null;
      document.getElementById('cardMeta').innerText = 'Done';
      document.getElementById('cardText').innerText = 'All caught up for today! 🎉';
      document.getElementById('cardHint').innerText = '';
    }
  }

  function flipCard() {
    if (!activeCard) return;
    isFlipped = !isFlipped;
    document.getElementById('cardMeta').innerText = isFlipped ? 'Answer' : 'Question';
    document.getElementById('cardText').innerText = isFlipped ? activeCard.back : activeCard.front;
    document.getElementById('srsControls').style.display = isFlipped ? 'grid' : 'none';
    if (isFlipped) {
      const g = activeCard.reps === 0 ? 1 : Math.round((activeCard.interval || 1) * activeCard.ef);
      document.getElementById('goodInt').innerText = `${g}d (3)`;
      document.getElementById('easyInt').innerText = `${Math.round(g * 1.3)}d (4)`;
    }
  }

  function answerCard(rating) {
    if (!activeCard) return;
    const updated = calculateSM2(activeCard, rating);
    const idx = db[currentDeck].findIndex(c => c.id === activeCard.id);
    db[currentDeck][idx] = updated;
    saveData();
    loadQueue();
  }

  /* --- LEARN MODE --- */
  let currentLearnIndex = 0;
  function startLearnCard() {
    const cards = db[currentDeck] || [];
    if (cards.length < 4) {
      document.getElementById('learnPrompt').innerText = 'Add at least 4 cards to unlock Learn mode!';
      document.getElementById('learnOptions').innerHTML = '';
      return;
    }
    const card = cards[currentLearnIndex % cards.length];
    document.getElementById('learnPrompt').innerText = card.front;

    // Distractors
    const others = cards.filter(c => c.id !== card.id).sort(() => 0.5 - Math.random()).slice(0, 3);
    const options = [...others, card].sort(() => 0.5 - Math.random());

    const container = document.getElementById('learnOptions');
    container.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.back;
      btn.onclick = () => {
        if (opt.id === card.id) {
          btn.classList.add('correct');
          setTimeout(() => { currentLearnIndex++; startLearnCard(); }, 600);
        } else {
          btn.classList.add('wrong');
        }
      };
      container.appendChild(btn);
    });
  }

  /* --- MATCH MODE --- */
  let selectedTile = null;
  let matchStartTime = null;
  let matchTimerInterval = null;

  function startMatchGame() {
    clearInterval(matchTimerInterval);
    const cards = (db[currentDeck] || []).slice(0, 6);
    if (cards.length < 2) return;

    let tiles = [];
    cards.forEach(c => {
      tiles.push({ id: c.id, text: c.front, type: 'front' });
      tiles.push({ id: c.id, text: c.back, type: 'back' });
    });
    tiles.sort(() => 0.5 - Math.random());

    const grid = document.getElementById('matchGrid');
    grid.innerHTML = '';
    selectedTile = null;

    tiles.forEach(t => {
      const el = document.createElement('div');
      el.className = 'tile';
      el.innerText = t.text;
      el.dataset.id = t.id;
      el.onclick = () => handleTileClick(el);
      grid.appendChild(el);
    });

    matchStartTime = Date.now();
    matchTimerInterval = setInterval(() => {
      document.getElementById('matchTimer').innerText = ((Date.now() - matchStartTime) / 1000).toFixed(1) + 's';
    }, 100);
  }

  function handleTileClick(tile) {
    if (tile.classList.contains('matched') || tile === selectedTile) return;
    if (!selectedTile) {
      selectedTile = tile;
      tile.classList.add('selected');
      return;
    }

    if (selectedTile.dataset.id === tile.dataset.id) {
      tile.classList.add('matched');
      selectedTile.classList.add('matched');
      selectedTile.classList.remove('selected');
      selectedTile = null;

      if (!document.querySelectorAll('.tile:not(.matched)').length) {
        clearInterval(matchTimerInterval);
      }
    } else {
      tile.classList.add('error');
      selectedTile.classList.add('error');
      setTimeout(() => {
        tile.classList.remove('error', 'selected');
        selectedTile.classList.remove('error', 'selected');
        selectedTile = null;
      }, 500);
    }
  }

  /* --- DATA & DECKS --- */
  function populateDecks() {
    const s = document.getElementById('deckSelector');
    s.innerHTML = '';
    Object.keys(db).forEach(n => {
      const o = document.createElement('option');
      o.value = n; o.innerText = n;
      if (n === currentDeck) o.selected = true;
      s.appendChild(o);
    });
  }

  function switchDeck() {
    currentDeck = document.getElementById('deckSelector').value;
    loadQueue();
  }

  function promptNewDeck() {
    const n = prompt('Deck Name:');
    if (n && !db[n]) {
      db[n] = [];
      currentDeck = n;
      populateDecks();
      saveData();
      loadQueue();
    }
  }

  function importBulk() {
    const raw = document.getElementById('bulkData').value.trim();
    if (!raw) return;
    const lines = raw.split('\n');
    lines.forEach(l => {
      const p = l.includes('\t') ? l.split('\t') : l.split('-');
      if (p.length >= 2) {
        db[currentDeck].push({
          id: Date.now() + Math.random(),
          front: p[0].trim(), back: p.slice(1).join('-').trim(),
          reps: 0, ef: 2.5, interval: 0, due: Date.now()
        });
      }
    });
    document.getElementById('bulkData').value = '';
    saveData();
    loadQueue();
    alert('Imported cards!');
  }

  function setupKeys() {
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); flipCard(); }
      if (isFlipped) {
        if (e.key === '1') answerCard(1);
        if (e.key === '2') answerCard(2);
        if (e.key === '3') answerCard(3);
        if (e.key === '4') answerCard(4);
      }
    });
  }

  function saveData() {
    localStorage.setItem('tb_study_suite', JSON.stringify(db));
    if (accessToken) pushToDrive();
  }

  async function pushToDrive() {
    const search = await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='toolbundle_suite.json'", {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const sData = await search.json();
    const fileId = sData.files?.[0]?.id;
    const blob = new Blob([JSON.stringify(db)], { type: 'application/json' });

    if (fileId) {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { Authorization: `Bearer ${accessToken}` },
        body: blob
      });
    } else {
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify({ name: 'toolbundle_suite.json', parents: ['appDataFolder'] })], { type: 'application/json' }));
      form.append('file', blob);
      await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { Authorization: `Bearer ${accessToken}` },
        body: form
      });
    }
  }

  async function pullFromDrive() {
    const search = await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='toolbundle_suite.json'", {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const sData = await search.json();
    if (sData.files?.length > 0) {
      const res = await fetch(`https://www.googleapis.com/drive/v3/files/${sData.files[0].id}?alt=media`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      db = await res.json();
      localStorage.setItem('tb_study_suite', JSON.stringify(db));
      populateDecks();
      loadQueue();
    }
  }
</script>
</body>
</html>
